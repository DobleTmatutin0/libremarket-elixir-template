
services:
  libremarket:
    image: elixir:1.17.3-alpine
    container_name: libremarket
    volumes:
      - ./:/app
      - compras_build:/tmp/build
      - compras_mix:/tmp/mix_home
      - compras_hex:/tmp/hex_home
      - compras_deps:/app/deps
    working_dir: /app
    environment:
      HOME: /tmp/mix_home
      MIX_HOME: /tmp/mix_home
      HEX_HOME: /tmp/hex_home
      MIX_BUILD_PATH: /tmp/build/libremarket
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    command: iex --sname libremarket --cookie secret -S mix
    stdin_open: true
    tty: true
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "127.0.0.1:4000:4000"

volumes:
  compras_build:
  compras_mix:
  compras_hex:
  compras_deps:
